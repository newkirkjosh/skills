  # Paste under `jobs:` in an existing workflow that runs on push and pull_request,
  # or wrap it in its own workflow file with that trigger.
  secrets:
    name: Scan full history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
